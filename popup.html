<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
      width: 260px;
      background: #0f0f0f;
      color: #f0f0f0;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid #222;
    }
    .header img { width: 32px; height: 32px; border-radius: 50%; }
    .header-text h1 { font-size: 15px; font-weight: 800; letter-spacing: -0.3px; }
    .header-text h1 span { color: #f5e642; }
    .header-text p { font-size: 10px; color: #666; margin-top: 1px; }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat-card {
      background: #1a1a1a;
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
    }
    .stat-card .icon { font-size: 16px; margin-bottom: 4px; }
    .stat-card .val {
      font-size: 17px;
      font-weight: 800;
      color: #f5e642;
      line-height: 1;
    }
    .stat-card .lbl {
      font-size: 9px;
      color: #555;
      margin-top: 3px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .room-chip {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      color: #888;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .room-val {
      font-weight: 700;
      color: #f5e642;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-settings {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      padding: 11px 0;
      background: #f5e642;
      color: #0f0f0f;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-settings:hover { opacity: 0.85; }
  </style>
</head>
<body>

  <div class="header">
    <img src="icon128.png" alt="FF">
    <div class="header-text">
      <h1>Focus <span>Friends</span></h1>
      <p>Anti-distracción activo</p>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="icon">🏆</div>
      <div class="val" id="score">—</div>
      <div class="lbl">Puntos</div>
    </div>
    <div class="stat-card">
      <div class="icon">🔥</div>
      <div class="val" id="streak">—</div>
      <div class="lbl">Racha</div>
    </div>
    <div class="stat-card">
      <div class="icon">⏱</div>
      <div class="val" id="penalty">—</div>
      <div class="lbl">Penaliz.</div>
    </div>
  </div>

  <div class="room-chip">
    <span>🎮 Sala</span>
    <span class="room-val" id="room">—</span>
  </div>

  <button class="btn-settings" id="openOptions">⚙️ Abrir ajustes</button>

  <script src="popup.js"></script>
</body>
</html>
